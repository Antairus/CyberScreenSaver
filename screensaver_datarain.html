<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CYBER-CORE // INTRUSION DETECT</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; cursor: none; font-family: 'Courier New', monospace; }
#terminal {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  padding: 0; overflow: hidden;
}
/* CRT scanlines */
#terminal::after {
  content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
  pointer-events: none; z-index: 99;
}
/* CRT flicker */
@keyframes flicker {
  0% { opacity: 0.97; }
  5% { opacity: 0.95; }
  10% { opacity: 0.98; }
  50% { opacity: 0.96; }
  100% { opacity: 0.97; }
}
#terminal { animation: flicker 0.15s infinite; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, frame = 0;

const C = {
  bg: '#000000',
  grid: 'rgba(0, 80, 30, 0.10)',
  gridMajor: 'rgba(0, 80, 30, 0.18)',
  faint: '#014020',
  dim: '#02A060',
  med: '#056930',
  bright: '#00FF80',
  glow: '#00FFB4',
  accent: '#04FF9A',
  amber: '#FFA820',
  red: '#FF2040',
  redDim: '#801020',
};

const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const DAYS = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];

// Terminal lines buffer — two columns
const LEFT_LINES = [];
const RIGHT_LINES = [];
const MAX_LINES = 200;
const LINE_H = 13;
const FONT = '11px Courier New';

// Typing state
let leftTyping = { text: '', idx: 0, color: C.dim, delay: 0, callback: null };
let rightTyping = { text: '', idx: 0, color: C.dim, delay: 0, callback: null };
let leftTimer = 0, rightTimer = 0;
let leftPause = 0, rightPause = 0;

// Fake IPs, hosts, hashes
const IPS = ['192.168.1.252','10.0.0.41','172.16.8.99','192.168.1.150','10.13.37.1','192.168.1.247','192.168.1.110','45.33.32.156','198.51.100.23','203.0.113.42','192.168.1.248','185.220.101.34','91.219.237.12','23.129.64.210'];
const HOSTS = ['CORE-SRV','WEB-NODE','DEV-BOX','FIREWALL','HYPERVISOR','NAS-01','PROXY-GW','CAM-NORTH','SWITCH-10G','CONTAINER-01','MAIL-SRV','AI-NODE','LLM-HOST','MQTT-BROKER'];
const PORTS = [22,80,443,5000,5002,5003,8123,8443,11434,1883,3306,6379,9001,53,8080,5432,27017,6443];
const USERS = ['root','admin','deploy','www-data','appuser','postgres','redis','mosquitto','node','git'];
const TOOLS = ['nmap','hydra','nikto','gobuster','sqlmap','metasploit','burpsuite','wireshark','aircrack','john'];
const SERVICES = ['sshd','nginx','flask','ollama','mosquitto','docker','systemd','dbus','rtsp-server','postgresql'];
const CVES = ['CVE-2026-1337','CVE-2025-48271','CVE-2026-0042','CVE-2024-31492','CVE-2026-7331','CVE-2025-21893'];
const HASHES = () => {
  let h = ''; for(let i=0;i<32;i++) h += '0123456789abcdef'[Math.random()*16|0]; return h;
};
const rnd = arr => arr[Math.random()*arr.length|0];
const rndInt = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const rndIP = () => rnd(IPS);
const pad2 = n => String(n).padStart(2,'0');

// Generate fake terminal commands and output
function genLeftLine() {
  const r = Math.random();

  if (r < 0.08) {
    // SSH brute force attempt
    const ip = rndIP();
    return [
      { t: `[sshd] Failed password for ${rnd(USERS)} from ${ip} port ${rndInt(30000,65000)}`, c: C.red },
      { t: `[sshd] Connection closed by authenticating user ${rnd(USERS)} ${ip} port ${rndInt(30000,65000)}`, c: C.redDim },
    ];
  } else if (r < 0.15) {
    // Port scan detection
    return [
      { t: `[pf] BLOCK ${rndIP()} -> ${rndIP()}:${rnd(PORTS)} TCP SYN`, c: C.amber },
      { t: `[pf] Rate limit exceeded from ${rndIP()} (${rndInt(50,500)} conn/s)`, c: C.amber },
    ];
  } else if (r < 0.22) {
    // Nmap scan
    const ip = rndIP();
    return [
      { t: `$ nmap -sV -A ${ip}`, c: C.bright },
      { t: `Starting Nmap scan against ${ip}...`, c: C.dim },
      { t: `PORT     STATE  SERVICE    VERSION`, c: C.dim },
      ...Array.from({length: rndInt(2,5)}, () => {
        const p = rnd(PORTS);
        return { t: `${String(p).padEnd(8)} open   ${rnd(SERVICES).padEnd(10)} ${rndInt(1,4)}.${rndInt(0,9)}.${rndInt(0,9)}`, c: C.accent };
      }),
      { t: `Nmap done: 1 host up, scanned in ${rndInt(2,15)}.${rndInt(10,99)}s`, c: C.dim },
    ];
  } else if (r < 0.28) {
    // Firewall blocks
    return Array.from({length: rndInt(2,4)}, () => ({
      t: `[iptables] DROP IN=eth0 SRC=${rndIP()} DST=${rndIP()} PROTO=TCP DPT=${rnd(PORTS)}`,
      c: C.amber,
    }));
  } else if (r < 0.34) {
    // Hash cracking
    return [
      { t: `$ john --wordlist=/usr/share/wordlists/rockyou.txt hashes.db`, c: C.bright },
      { t: `Loaded ${rndInt(3,20)} password hashes (sha512crypt)`, c: C.dim },
      { t: `Press 'q' to abort, status: ${rndInt(10,95)}% complete`, c: C.dim },
      { t: `${HASHES()}  (${rnd(USERS)})`, c: C.glow },
    ];
  } else if (r < 0.40) {
    // Directory brute force
    const host = rnd(HOSTS);
    return [
      { t: `$ gobuster dir -u https://${host.toLowerCase()}.local -w common.txt`, c: C.bright },
      ...Array.from({length: rndInt(3,6)}, () => {
        const code = rnd([200,301,403,404,500]);
        const path = '/' + rnd(['admin','api','login','.env','config','backup','wp-admin','dashboard','debug','phpmyadmin','server-status','.git']);
        const color = code === 200 ? C.glow : code === 403 ? C.amber : code === 301 ? C.accent : C.dim;
        return { t: `[${code}] ${path.padEnd(24)} ${rndInt(100,50000)}B`, c: color };
      }),
    ];
  } else if (r < 0.46) {
    // CVE exploit attempt
    const cve = rnd(CVES);
    return [
      { t: `[IDS] ALERT: Exploit attempt detected`, c: C.red },
      { t: `  Signature: ${cve} (${rnd(['RCE','SQLi','LFI','XSS','SSRF','BufferOverflow'])})`, c: C.red },
      { t: `  Source: ${rndIP()}  Target: ${rndIP()}:${rnd(PORTS)}`, c: C.redDim },
      { t: `  Action: BLOCKED  Severity: ${rnd(['CRITICAL','HIGH','MEDIUM'])}`, c: C.amber },
    ];
  } else if (r < 0.52) {
    // Packet capture
    return Array.from({length: rndInt(3,6)}, () => {
      const proto = rnd(['TCP','UDP','ICMP','DNS','TLS']);
      return {
        t: `${rndIP().padEnd(16)} -> ${rndIP().padEnd(16)} ${proto.padEnd(5)} len=${rndInt(40,1500)} ttl=${rndInt(50,128)}`,
        c: C.faint,
      };
    });
  } else if (r < 0.58) {
    // SQL injection attempt
    return [
      { t: `[WAF] SQL Injection attempt from ${rndIP()}`, c: C.red },
      { t: `  Payload: ' OR 1=1; DROP TABLE users;--`, c: C.redDim },
      { t: `  Target: /api/login  Method: POST`, c: C.dim },
      { t: `  Response: 403 Forbidden (blocked by WAF rule #${rndInt(1000,9999)})`, c: C.amber },
    ];
  } else if (r < 0.64) {
    // Hydra brute force
    const host = rndIP();
    return [
      { t: `$ hydra -l ${rnd(USERS)} -P rockyou.txt ${host} ssh`, c: C.bright },
      { t: `Hydra (https://github.com/vanhauser-thc/thc-hydra)`, c: C.dim },
      { t: `[DATA] max 16 tasks, ${rndInt(1000,14000000)} login tries`, c: C.dim },
      { t: `[${rnd(PORTS)}][ssh] host: ${host}  login: ${rnd(USERS)}  password: ********`, c: C.glow },
      { t: `[STATUS] ${rndInt(100,500)}/min, ${rndInt(1000,9999)} tries, ${rndInt(100000,999999)} remaining`, c: C.dim },
    ];
  } else if (r < 0.70) {
    // Process list
    return [
      { t: `$ ps aux --sort=-%mem | head -6`, c: C.bright },
      { t: `USER       PID  %CPU %MEM    VSZ   RSS COMMAND`, c: C.dim },
      { t: `ollama   ${rndInt(1000,9999)}  ${rndInt(1,30)}.${rndInt(0,9)}  ${rndInt(10,40)}.${rndInt(0,9)}  ${rndInt(10,40)}G  ${rndInt(1,20)}G  ollama serve`, c: C.accent },
      { t: `deploy   ${rndInt(1000,9999)}   ${rndInt(1,15)}.${rndInt(0,9)}  ${rndInt(5,15)}.${rndInt(0,9)}  ${rndInt(5,15)}G  ${rndInt(1,8)}G  python inference.py`, c: C.accent },
      { t: `deploy   ${rndInt(1000,9999)}   ${rndInt(1,10)}.${rndInt(0,9)}   ${rndInt(2,8)}.${rndInt(0,9)}  ${rndInt(2,10)}G  ${rndInt(500,4000)}M  python api_server.py`, c: C.accent },
      { t: `root     ${rndInt(1000,9999)}   ${rndInt(0,5)}.${rndInt(0,9)}   ${rndInt(1,5)}.${rndInt(0,9)}  ${rndInt(1,5)}G  ${rndInt(200,900)}M  dockerd`, c: C.dim },
    ];
  } else if (r < 0.76) {
    // Crypto mining detection
    return [
      { t: `[ALERT] Suspicious outbound connection detected`, c: C.red },
      { t: `  Process: /tmp/.x/${rnd(['kworker','systemd-helper','xmrig'])}`, c: C.redDim },
      { t: `  Dest: ${rndInt(50,220)}.${rndInt(0,255)}.${rndInt(0,255)}.${rndInt(1,254)}:${rnd([3333,4444,8333,14444])}`, c: C.redDim },
      { t: `  Protocol: Stratum (crypto mining)`, c: C.amber },
      { t: `  Action: KILLED PID ${rndInt(10000,60000)}, connection RESET`, c: C.glow },
    ];
  } else if (r < 0.82) {
    // System logs
    return [
      { t: `[kernel] [${rndInt(1000,9999)}.${rndInt(100,999)}] nvidia 0000:08:00.0: VRAM ${rndInt(20000,23000)}/${24576} MiB`, c: C.dim },
      { t: `[systemd] Started ${rnd(SERVICES)}.service`, c: C.dim },
      { t: `[docker] Container ${rnd(['homeassistant','mosquitto','nginx','redis'])} health: OK`, c: C.accent },
    ];
  } else if (r < 0.88) {
    // Network sniff
    return [
      { t: `$ tcpdump -i eth0 -c 5 'port not 22'`, c: C.bright },
      ...Array.from({length: rndInt(3,5)}, () => ({
        t: `${pad2(rndInt(0,23))}:${pad2(rndInt(0,59))}:${pad2(rndInt(0,59))}.${rndInt(100,999)} IP ${rndIP()}.${rndInt(1024,65000)} > ${rndIP()}.${rnd(PORTS)}: Flags [${rnd(['S','.','P.','F.','S.'])}], seq ${rndInt(1000000,9999999)}, len ${rndInt(0,1400)}`,
        c: C.faint,
      })),
    ];
  } else if (r < 0.94) {
    // Checksums / file integrity
    return [
      { t: `[tripwire] File integrity check:`, c: C.dim },
      { t: `  MODIFIED: /etc/shadow  (${HASHES().substring(0,16)}...)`, c: C.red },
      { t: `  MODIFIED: /usr/bin/sudo  (${HASHES().substring(0,16)}...)`, c: C.red },
      { t: `  OK: ${rndInt(2000,8000)} files verified, ${rndInt(0,3)} anomalies`, c: C.amber },
    ];
  } else {
    // Blank / separator
    return [
      { t: ``, c: C.bg },
    ];
  }
}

function genRightLine() {
  const r = Math.random();

  if (r < 0.15) {
    // Hex dump
    return Array.from({length: rndInt(4,8)}, (_, i) => ({
      t: `0x${(0xA000 + i * 16).toString(16).toUpperCase()}  ${Array.from({length:8},()=>Math.floor(Math.random()*256).toString(16).toUpperCase().padStart(2,'0')).join(' ')}  ${Array.from({length:8},()=>{const c=rndInt(33,126);return String.fromCharCode(c)}).join('')}`,
      c: C.faint,
    }));
  } else if (r < 0.28) {
    // Auth log
    return [
      { t: `[auth.log] ${pad2(rndInt(0,23))}:${pad2(rndInt(0,59))}:${pad2(rndInt(0,59))}`, c: C.med },
      ...Array.from({length: rndInt(2,4)}, () => {
        const success = Math.random() > 0.6;
        return {
          t: `  ${success ? 'Accepted' : 'Failed'} publickey for ${rnd(USERS)} from ${rndIP()}`,
          c: success ? C.accent : C.red,
        };
      }),
    ];
  } else if (r < 0.40) {
    // Network connections
    return [
      { t: `$ ss -tunap | grep ESTAB`, c: C.bright },
      ...Array.from({length: rndInt(3,6)}, () => ({
        t: `tcp  ESTAB  ${rndIP()}:${rnd(PORTS)}  ${rndIP()}:${rndInt(30000,65000)}  ${rnd(SERVICES)}`,
        c: C.dim,
      })),
    ];
  } else if (r < 0.52) {
    // DNS queries
    return [
      { t: `[dns-query] Recent lookups:`, c: C.med },
      ...Array.from({length: rndInt(3,5)}, () => ({
        t: `  ${rnd(['A','AAAA','CNAME','MX','TXT'])}  ${rnd(['api.github.com','docker.io','registry.npmjs.org','pypi.org','ntp.ubuntu.com','dl.google.com','cdn.cloudflare.com','updates.jenkins.io','grafana.internal'])}  -> ${rndIP()}`,
        c: C.dim,
      })),
    ];
  } else if (r < 0.62) {
    // SSL cert info
    return [
      { t: `[tls] Certificate scan:`, c: C.med },
      { t: `  Subject: CN=${rnd(['portal.internal','mail.internal','*.cloudflare.com'])}`, c: C.dim },
      { t: `  Issuer: Let's Encrypt Authority X3`, c: C.dim },
      { t: `  Valid: ${rndInt(30,364)} days remaining`, c: Math.random()>0.3 ? C.accent : C.amber },
      { t: `  Fingerprint: ${HASHES().substring(0,20)}`, c: C.faint },
    ];
  } else if (r < 0.74) {
    // Suricata/IDS rules
    return [
      { t: `[suricata] Rule matches (last 60s):`, c: C.med },
      ...Array.from({length: rndInt(2,4)}, () => ({
        t: `  [${rndInt(2000000,2099999)}] ${rnd(['ET SCAN','ET POLICY','ET TROJAN','ET EXPLOIT','GPL ATTACK'])} ${rnd(['Potential SSH scan','Outbound IRC','DNS query for .onion','Suspicious UA string','Known C2 beacon'])}`,
        c: Math.random() > 0.5 ? C.amber : C.red,
      })),
    ];
  } else if (r < 0.85) {
    // Failed login attempts table
    const ip = rndIP();
    return [
      { t: `[fail2ban] Status for sshd:`, c: C.med },
      { t: `  Currently banned: ${rndInt(2,15)}`, c: C.amber },
      { t: `  Total banned:     ${rndInt(100,9999)}`, c: C.dim },
      { t: `  Banned IPs:`, c: C.dim },
      ...Array.from({length: rndInt(2,4)}, () => ({
        t: `    ${rndIP().padEnd(18)} (${rndInt(5,200)} attempts)`,
        c: C.redDim,
      })),
    ];
  } else {
    // Blank
    return [{ t: ``, c: C.bg }];
  }
}

// Line queue system
let leftQueue = [];
let rightQueue = [];
let leftDelay = 0, rightDelay = 0;
let lastLeft = 0, lastRight = 0;
const LEFT_SPEED = 80;   // ms per line
const RIGHT_SPEED = 110;  // ms per line

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function drawGrid() {
  ctx.strokeStyle = C.grid;
  ctx.lineWidth = 0.5;
  for (let x = 0; x < W; x += 20) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 20) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.strokeStyle = C.gridMajor;
  for (let x = 0; x < W; x += 100) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
}

function drawChrome() {
  // Top bar
  ctx.fillStyle = C.accent;
  ctx.fillRect(0, 0, W, 3);
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 3, W, 25);
  ctx.strokeStyle = C.med;
  ctx.beginPath(); ctx.moveTo(0, 28); ctx.lineTo(W, 28); ctx.stroke();

  ctx.font = '11px Courier New';
  ctx.fillStyle = C.dim;
  ctx.fillText('CLASSIFICATION:', 12, 14);
  ctx.fillStyle = C.red;
  ctx.fillText('THREAT DETECTED', 120, 14);
  ctx.fillStyle = C.faint;
  ctx.fillText('TERMINAL 7 // CYBER-CORE v2.0', 12, 24);

  ctx.fillStyle = C.red;
  ctx.textAlign = 'right';
  // Blinking INTRUSION warning
  if (Math.floor(frame / 30) % 2 === 0) {
    ctx.fillText('!! INTRUSION DETECTED !!', W - 12, 14);
  } else {
    ctx.fillStyle = C.redDim;
    ctx.fillText('!! INTRUSION DETECTED !!', W - 12, 14);
  }
  ctx.fillStyle = C.faint;
  ctx.fillText('IDS // ACTIVE MONITORING', W - 12, 24);
  ctx.textAlign = 'left';

  // Divider line down center
  const cx = Math.floor(W / 2);
  ctx.strokeStyle = C.med;
  ctx.beginPath(); ctx.moveTo(cx, 28); ctx.lineTo(cx, H - 20); ctx.stroke();

  // Column headers
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 29, W, 14);
  ctx.font = '10px Courier New';
  ctx.fillStyle = C.accent;
  ctx.fillText('  SYSTEM LOG // THREAT ANALYSIS', 4, 40);
  ctx.fillText('  NETWORK MONITOR // AUTH LOG', cx + 4, 40);
  ctx.strokeStyle = C.med;
  ctx.beginPath(); ctx.moveTo(0, 44); ctx.lineTo(W, 44); ctx.stroke();

  // Bottom bar
  const by = H - 20;
  ctx.strokeStyle = C.med;
  ctx.beginPath(); ctx.moveTo(0, by); ctx.lineTo(W, by); ctx.stroke();
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, by + 1, W, 19);
  ctx.font = '11px Courier New';
  ctx.fillStyle = C.dim;
  const blocked = rndInt(200, 9999);
  ctx.fillText(`FIREWALL: ${blocked} BLOCKED  //  IDS RULES: ${rndInt(5000,15000)} LOADED  //  UPTIME: ${rndInt(1,99)}d ${rndInt(0,23)}h`, 12, by + 14);
  ctx.fillStyle = C.faint;
  ctx.textAlign = 'right';
  ctx.fillText('CYBER-CORE // DEFENSE GRID ACTIVE', W - 12, by + 14);
  ctx.textAlign = 'left';
}

function drawClock() {
  const now = new Date();
  const timeStr = [now.getHours(), now.getMinutes(), now.getSeconds()]
    .map(v => String(v).padStart(2, '0')).join(':');
  const dateStr = `${String(now.getDate()).padStart(2,'0')} ${MONTHS[now.getMonth()]} ${now.getFullYear()} // ${DAYS[now.getDay()]}`;

  // Clock centered
  const cx = W / 2, cy = H / 2;
  const bw = 280, bh = 100;

  // Dark background behind clock
  ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
  ctx.fillRect(cx - bw/2, cy - bh/2, bw, bh);

  // Border
  ctx.strokeStyle = C.med;
  ctx.strokeRect(cx - bw/2, cy - bh/2, bw, bh);

  // Corner brackets
  const p = 4;
  ctx.strokeStyle = C.accent;
  ctx.lineWidth = 2;
  const corners = [
    [cx-bw/2-p, cy-bh/2-p, 1, 1],
    [cx+bw/2+p, cy-bh/2-p, -1, 1],
    [cx-bw/2-p, cy+bh/2+p, 1, -1],
    [cx+bw/2+p, cy+bh/2+p, -1, -1],
  ];
  corners.forEach(([x, y, dx, dy]) => {
    ctx.beginPath();
    ctx.moveTo(x, y + dy * -16);
    ctx.lineTo(x, y);
    ctx.lineTo(x + dx * 16, y);
    ctx.stroke();
  });
  ctx.lineWidth = 1;

  // Label
  ctx.font = '10px Courier New';
  ctx.fillStyle = C.accent;
  ctx.textAlign = 'center';
  ctx.fillText('SYSTEM TIME', cx, cy - bh/2 + 16);

  // Time
  ctx.font = '48px Courier New';
  ctx.fillStyle = C.glow;
  ctx.fillText(timeStr, cx, cy + 8);

  // Date
  ctx.font = '13px Courier New';
  ctx.fillStyle = C.dim;
  ctx.fillText(dateStr, cx, cy + 30);

  ctx.textAlign = 'left';
}

function drawLines(lines, startX, maxWidth) {
  const startY = 48;
  const visibleLines = Math.floor((H - 70) / LINE_H);
  const start = Math.max(0, lines.length - visibleLines);
  ctx.font = FONT;

  for (let i = start; i < lines.length; i++) {
    const ln = lines[i];
    const y = startY + (i - start) * LINE_H;
    if (y > H - 25) break;

    ctx.fillStyle = ln.c;
    ctx.fillText(ln.t, startX, y);
  }

  // Blinking cursor at bottom
  const cursorY = startY + (Math.min(lines.length, visibleLines)) * LINE_H;
  if (cursorY < H - 25 && Math.floor(frame / 20) % 2 === 0) {
    ctx.fillStyle = C.bright;
    ctx.fillRect(startX, cursorY - 9, 7, 11);
  }
}

function render(timestamp) {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  drawGrid();

  const cx = Math.floor(W / 2);
  const colWidth = cx - 20;

  // Feed left column
  if (timestamp - lastLeft > LEFT_SPEED + leftDelay) {
    if (leftQueue.length === 0) {
      leftQueue = genLeftLine();
      leftDelay = rndInt(50, 800); // pause between blocks
    }
    if (leftQueue.length > 0) {
      LEFT_LINES.push(leftQueue.shift());
      if (LEFT_LINES.length > MAX_LINES) LEFT_LINES.splice(0, 50);
      leftDelay = leftQueue.length > 0 ? rndInt(20, 80) : rndInt(200, 1500);
    }
    lastLeft = timestamp;
  }

  // Feed right column
  if (timestamp - lastRight > RIGHT_SPEED + rightDelay) {
    if (rightQueue.length === 0) {
      rightQueue = genRightLine();
      rightDelay = rndInt(100, 1200);
    }
    if (rightQueue.length > 0) {
      RIGHT_LINES.push(rightQueue.shift());
      if (RIGHT_LINES.length > MAX_LINES) RIGHT_LINES.splice(0, 50);
      rightDelay = rightQueue.length > 0 ? rndInt(30, 100) : rndInt(300, 2000);
    }
    lastRight = timestamp;
  }

  // Draw terminal lines
  drawLines(LEFT_LINES, 8, colWidth);
  drawLines(RIGHT_LINES, cx + 8, colWidth);

  drawChrome();
  drawClock();

  // Occasional screen glitch
  if (Math.random() < 0.003) {
    const gy = rndInt(0, H);
    const gh = rndInt(2, 8);
    const shift = rndInt(-10, 10);
    const imgData = ctx.getImageData(0, gy, W, gh);
    ctx.putImageData(imgData, shift, gy);
  }

  frame++;
  requestAnimationFrame(render);
}

window.addEventListener('resize', resize);
resize();
render(0);
</script>
</body>
</html>
