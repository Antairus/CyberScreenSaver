<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CYBER-CORE // LIVE NETWORK</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; cursor: none; font-family: 'Courier New', monospace; }
canvas { display: block; }
body::after {
  content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
  pointer-events: none; z-index: 99;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, frame = 0;
let nodes = [], packets = [], hexBlocks = [];
let liveDevices = [];
let subnet = '';
let localIP = '';
let lastFetch = 0;
const FETCH_INTERVAL = 10000; // poll every 10s

const C = {
  bg: '#000000',
  grid: 'rgba(0, 80, 30, 0.12)',
  gridMajor: 'rgba(0, 80, 30, 0.22)',
  faint: '#014020',
  dim: '#02A060',
  med: '#056930',
  bright: '#00FF80',
  glow: '#00FFB4',
  accent: '#04FF9A',
  amber: '#FFA820',
  red: '#FF4040',
  cyan: '#00FFFF',
  magenta: '#FF00FF',
};

// Device type colors
const TYPE_COLORS = {
  router:       { fill: C.red,     ring: '#FF6060',  label: 'ROUTER' },
  switch:       { fill: C.amber,   ring: '#FFB840',  label: 'SWITCH' },
  access_point: { fill: C.cyan,    ring: '#40FFFF',  label: 'AP' },
  workstation:  { fill: C.magenta, ring: '#FF40FF',  label: 'SELF' },
  hypervisor:   { fill: '#8855FF', ring: '#AA77FF',  label: 'HV' },
  storage:      { fill: C.amber,   ring: '#FFB840',  label: 'NAS' },
  camera:       { fill: '#FF8800', ring: '#FFAA44',  label: 'CAM' },
  container:    { fill: '#4488FF', ring: '#6699FF',  label: 'DOCKER' },
  iot:          { fill: C.glow,    ring: C.accent,   label: 'IOT' },
  media:        { fill: '#FF44AA', ring: '#FF66CC',  label: 'MEDIA' },
  mobile:       { fill: '#44AAFF', ring: '#66CCFF',  label: 'MOBILE' },
  printer:      { fill: '#AAAAAA', ring: '#CCCCCC',  label: 'PRINT' },
  server:       { fill: C.glow,    ring: C.accent,   label: 'SRV' },
};

const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

function fetchNetwork() {
  fetch('http://127.0.0.1:5050/api/network')
    .then(r => r.json())
    .then(data => {
      if (data.devices && data.devices.length > 0) {
        const changed = data.devices.length !== liveDevices.length ||
          JSON.stringify(data.devices.map(d=>d.ip)) !== JSON.stringify(liveDevices.map(d=>d.ip));
        liveDevices = data.devices;
        subnet = data.subnet || '';
        localIP = data.local_ip || '';
        if (changed) rebuildNodes();
      }
    })
    .catch(() => {});
}

function rebuildNodes() {
  const oldPositions = {};
  for (const n of nodes) {
    oldPositions[n.ip] = { x: n.x, y: n.y, vx: n.vx, vy: n.vy };
  }

  nodes = [];
  const margin = 100;
  const count = liveDevices.length;

  for (let i = 0; i < count; i++) {
    const dev = liveDevices[i];
    const tc = TYPE_COLORS[dev.type] || TYPE_COLORS.server;

    let x, y, vx, vy;
    if (oldPositions[dev.ip]) {
      // Keep existing position
      x = oldPositions[dev.ip].x;
      y = oldPositions[dev.ip].y;
      vx = oldPositions[dev.ip].vx;
      vy = oldPositions[dev.ip].vy;
    } else {
      // New device — place in orbit
      const angle = (i / count) * Math.PI * 2;
      const radiusX = (W / 2 - margin * 2) * (0.3 + Math.random() * 0.5);
      const radiusY = (H / 2 - margin * 2) * (0.3 + Math.random() * 0.5);
      x = W / 2 + Math.cos(angle) * radiusX;
      y = H / 2 + Math.sin(angle) * radiusY;
      vx = (Math.random() - 0.5) * 0.2;
      vy = (Math.random() - 0.5) * 0.2;
    }

    // Router gets center position and bigger radius
    const isRouter = dev.type === 'router';
    const isSelf = dev.is_self;

    nodes.push({
      x: isRouter && !oldPositions[dev.ip] ? W / 2 : x,
      y: isRouter && !oldPositions[dev.ip] ? H / 2 : y,
      vx: isRouter ? 0 : vx,
      vy: isRouter ? 0 : vy,
      radius: isRouter ? 8 : isSelf ? 7 : 4 + Math.random() * 3,
      pulsePhase: Math.random() * Math.PI * 2,
      name: dev.hostname,
      ip: dev.ip,
      mac: dev.mac,
      type: dev.type,
      isSelf: isSelf,
      color: tc.fill,
      ringColor: tc.ring,
      typeLabel: tc.label,
      active: true,
      connections: [],
    });
  }

  // Build connections — everything connects to router, plus nearest neighbors
  const routerIdx = nodes.findIndex(n => n.type === 'router');
  for (let i = 0; i < nodes.length; i++) {
    const conns = new Set();
    // Connect to router
    if (routerIdx >= 0 && i !== routerIdx) {
      conns.add(routerIdx);
    }
    // Add 1-2 nearest neighbors
    const dists = [];
    for (let j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      dists.push({ idx: j, d: Math.sqrt(dx * dx + dy * dy) });
    }
    dists.sort((a, b) => a.d - b.d);
    for (let k = 0; k < Math.min(2, dists.length); k++) {
      conns.add(dists[k].idx);
    }
    nodes[i].connections = Array.from(conns);
  }

  packets = [];
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  if (liveDevices.length > 0) {
    rebuildNodes();
  }
}

function generateHex() {
  const lines = [];
  for (let r = 0; r < 8; r++) {
    let line = '0x' + (0xA000 + r * 16).toString(16).toUpperCase() + '  ';
    for (let c = 0; c < 8; c++) {
      line += Math.floor(Math.random() * 256).toString(16).toUpperCase().padStart(2, '0') + ' ';
    }
    lines.push(line);
  }
  return lines;
}

function spawnPacket() {
  if (nodes.length < 2) return;
  const from = Math.floor(Math.random() * nodes.length);
  if (nodes[from].connections.length === 0) return;
  const to = nodes[from].connections[Math.floor(Math.random() * nodes[from].connections.length)];
  packets.push({
    from, to, t: 0,
    speed: 0.006 + Math.random() * 0.01,
    color: nodes[from].color,
    size: 2 + Math.random() * 2,
  });
  logPacket(nodes[from], nodes[to]);
}

function drawGrid() {
  ctx.strokeStyle = C.grid;
  ctx.lineWidth = 0.5;
  for (let x = 0; x < W; x += 20) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 20) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.strokeStyle = C.gridMajor;
  for (let x = 0; x < W; x += 100) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
}

function drawChrome() {
  // Top bar
  ctx.fillStyle = C.accent;
  ctx.fillRect(0, 0, W, 3);
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 3, W, 28);
  ctx.strokeStyle = C.med;
  ctx.beginPath(); ctx.moveTo(0, 31); ctx.lineTo(W, 31); ctx.stroke();

  ctx.font = '11px Courier New';
  ctx.fillStyle = C.dim;
  ctx.fillText('CLASSIFICATION:', 12, 14);
  ctx.fillStyle = C.bright;
  ctx.fillText('LIVE SCAN', 120, 14);
  ctx.fillStyle = C.faint;
  ctx.fillText('TERMINAL 7 // CYBER-CORE v2.0', 12, 26);

  // Clock
  const now = new Date();
  const timeStr = [now.getHours(), now.getMinutes(), now.getSeconds()]
    .map(v => String(v).padStart(2, '0')).join(':');
  const dateStr = `${String(now.getDate()).padStart(2,'0')} ${MONTHS[now.getMonth()]} ${now.getFullYear()} // ${DAYS[now.getDay()]}`;
  ctx.textAlign = 'center';
  ctx.fillStyle = C.glow;
  ctx.fillText(timeStr, W / 2, 14);
  ctx.fillStyle = C.dim;
  ctx.fillText(dateStr, W / 2, 26);
  ctx.textAlign = 'left';

  ctx.fillStyle = C.accent;
  ctx.textAlign = 'right';
  ctx.fillText('SYS://LIVE_TOPOLOGY', W - 12, 14);
  ctx.fillStyle = C.faint;
  ctx.fillText(subnet ? `SUBNET: ${subnet}` : 'SCANNING...', W - 12, 26);
  ctx.textAlign = 'left';

  // Bottom bar
  const by = H - 20;
  ctx.strokeStyle = C.med;
  ctx.beginPath(); ctx.moveTo(0, by); ctx.lineTo(W, by); ctx.stroke();
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, by + 1, W, 19);
  ctx.font = '11px Courier New';
  ctx.fillStyle = C.dim;
  const onlineCount = nodes.filter(n => n.active).length;
  ctx.fillText(`NODES: ${onlineCount} ONLINE  //  PACKETS: ${packets.length} IN TRANSIT  //  LOCAL: ${localIP || 'DETECTING...'}`, 12, by + 14);
  ctx.fillStyle = C.faint;
  ctx.textAlign = 'right';
  ctx.fillText('CYBER-CORE // LIVE NETWORK', W - 12, by + 14);
  ctx.textAlign = 'left';
}

function drawConnections() {
  ctx.lineWidth = 0.8;
  for (const node of nodes) {
    for (const ci of node.connections) {
      const other = nodes[ci];
      const grad = ctx.createLinearGradient(node.x, node.y, other.x, other.y);
      grad.addColorStop(0, hexToRgba(node.color, 0.2));
      grad.addColorStop(0.5, hexToRgba(node.color, 0.06));
      grad.addColorStop(1, hexToRgba(other.color, 0.2));
      ctx.strokeStyle = grad;
      ctx.beginPath();
      ctx.moveTo(node.x, node.y);
      ctx.lineTo(other.x, other.y);
      ctx.stroke();
    }
  }
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16) || 0;
  const g = parseInt(hex.slice(3, 5), 16) || 0;
  const b = parseInt(hex.slice(5, 7), 16) || 0;
  return `rgba(${r},${g},${b},${alpha})`;
}

function drawNodes() {
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    const pulse = Math.sin(frame * 0.03 + n.pulsePhase) * 0.5 + 0.5;

    // Glow
    const glowR = n.radius * 3 + pulse * 8;
    const grd = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, glowR);
    grd.addColorStop(0, hexToRgba(n.color, 0.15));
    grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(n.x, n.y, glowR, 0, Math.PI * 2);
    ctx.fill();

    // Outer ring
    ctx.strokeStyle = n.ringColor;
    ctx.lineWidth = n.isSelf ? 2 : 1;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.radius + 2 + pulse * 2, 0, Math.PI * 2);
    ctx.stroke();

    // Self gets double ring
    if (n.isSelf) {
      ctx.strokeStyle = hexToRgba(n.ringColor, 0.4);
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius + 6 + pulse * 3, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Core
    ctx.fillStyle = n.color;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
    ctx.fill();

    // Inner dot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(n.x, n.y, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Hostname label
    ctx.font = '10px Courier New';
    ctx.fillStyle = n.color;
    ctx.textAlign = 'center';
    ctx.fillText(n.name, n.x, n.y + n.radius + 14);

    // IP label
    ctx.fillStyle = C.faint;
    ctx.font = '9px Courier New';
    ctx.fillText(n.ip, n.x, n.y + n.radius + 25);

    // Type badge
    ctx.fillStyle = hexToRgba(n.color, 0.5);
    ctx.font = '8px Courier New';
    ctx.fillText(n.typeLabel, n.x, n.y - n.radius - 8);

    ctx.textAlign = 'left';
  }
}

function drawPackets() {
  for (let i = packets.length - 1; i >= 0; i--) {
    const p = packets[i];
    p.t += p.speed;
    if (p.t >= 1) {
      if (nodes[p.to]) nodes[p.to].pulsePhase = frame * 0.03;
      packets.splice(i, 1);
      continue;
    }

    const from = nodes[p.from];
    const to = nodes[p.to];
    if (!from || !to) { packets.splice(i, 1); continue; }

    const x = from.x + (to.x - from.x) * p.t;
    const y = from.y + (to.y - from.y) * p.t;

    // Trail
    for (let tr = 1; tr <= 4; tr++) {
      const tt = p.t - tr * p.speed * 2;
      if (tt < 0) continue;
      const tx = from.x + (to.x - from.x) * tt;
      const ty = from.y + (to.y - from.y) * tt;
      ctx.fillStyle = hexToRgba(p.color, 0.15 - tr * 0.03);
      ctx.beginPath();
      ctx.arc(tx, ty, p.size * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y, 1, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── Packet log for bottom-left panel ──
let packetLog = [];
const MAX_LOG = 10;
let totalPacketsSent = 0;

function logPacket(fromNode, toNode) {
  totalPacketsSent++;
  packetLog.unshift({
    from: fromNode.name,
    to: toNode.name,
    time: new Date(),
    fromIP: fromNode.ip,
    toIP: toNode.ip,
  });
  if (packetLog.length > MAX_LOG) packetLog.pop();
}

// ── Top-Left: Network Summary ──
function drawPanelTopLeft() {
  const px = 14, py = 42, pw = 222, ph = 130;
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(px - 4, py - 4, pw, ph);
  ctx.strokeStyle = C.med;
  ctx.strokeRect(px - 4, py - 4, pw, ph);

  ctx.font = '10px Courier New';
  ctx.fillStyle = C.accent;
  ctx.fillText('NETWORK STATUS', px, py + 8);
  ctx.strokeStyle = C.med;
  ctx.beginPath(); ctx.moveTo(px, py + 12); ctx.lineTo(px + 110, py + 12); ctx.stroke();

  const lines = [
    ['SUBNET', subnet || 'SCANNING...'],
    ['LOCAL IP', localIP || 'DETECTING...'],
    ['NODES', String(nodes.length)],
    ['ONLINE', String(nodes.filter(n => n.active).length)],
    ['PACKETS TX', String(totalPacketsSent)],
    ['SCAN MODE', 'ARP + PING'],
    ['INTERVAL', '30s'],
  ];

  for (let i = 0; i < lines.length; i++) {
    const y = py + 24 + i * 14;
    ctx.fillStyle = C.dim;
    ctx.fillText(lines[i][0], px, y);
    ctx.fillStyle = C.faint;
    ctx.fillText('.' .repeat(Math.max(1, 18 - lines[i][0].length - lines[i][1].length)), px + lines[i][0].length * 6 + 4, y);
    ctx.fillStyle = i < 2 ? C.glow : C.dim;
    ctx.textAlign = 'right';
    ctx.fillText(lines[i][1], px + pw - 12, y);
    ctx.textAlign = 'left';
  }

  // Blinking scan indicator
  if (Math.floor(frame / 20) % 2 === 0) {
    ctx.fillStyle = C.bright;
    ctx.fillRect(px + pw - 20, py + 2, 6, 6);
  }
}

// ── Top-Right: Device Type Legend ──
function drawPanelTopRight() {
  const pw = 222, ph = 130;
  const px = W - pw - 10, py = 42;
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(px - 4, py - 4, pw, ph);
  ctx.strokeStyle = C.med;
  ctx.strokeRect(px - 4, py - 4, pw, ph);

  ctx.font = '10px Courier New';
  ctx.fillStyle = C.accent;
  ctx.fillText('DEVICE TYPES', px, py + 8);
  ctx.strokeStyle = C.med;
  ctx.beginPath(); ctx.moveTo(px, py + 12); ctx.lineTo(px + 100, py + 12); ctx.stroke();

  // Collect unique types with counts
  const typeCounts = {};
  for (const n of nodes) {
    typeCounts[n.type] = (typeCounts[n.type] || 0) + 1;
  }

  let row = 0;
  const maxRows = 8;
  for (const type in typeCounts) {
    if (row >= maxRows) break;
    const tc = TYPE_COLORS[type] || TYPE_COLORS.server;
    const ry = py + 24 + row * 13;

    // Color swatch
    ctx.fillStyle = tc.fill;
    ctx.fillRect(px, ry - 4, 8, 8);

    // Label and count
    ctx.fillStyle = C.dim;
    ctx.fillText(tc.label, px + 14, ry + 3);
    ctx.fillStyle = C.faint;
    ctx.textAlign = 'right';
    ctx.fillText(String(typeCounts[type]), px + pw - 12, ry + 3);
    ctx.textAlign = 'left';
    row++;
  }

  // Total at bottom
  if (row < maxRows) {
    const ty = py + 24 + row * 13 + 4;
    ctx.strokeStyle = C.med;
    ctx.beginPath(); ctx.moveTo(px, ty - 6); ctx.lineTo(px + pw - 12, ty - 6); ctx.stroke();
    ctx.fillStyle = C.accent;
    ctx.fillText('TOTAL', px, ty + 4);
    ctx.textAlign = 'right';
    ctx.fillText(String(nodes.length), px + pw - 12, ty + 4);
    ctx.textAlign = 'left';
  }
}

// ── Bottom-Left: Packet Activity Log ──
function drawPanelBottomLeft() {
  const px = 14, ph = 140, pw = 260;
  const py = H - ph - 28;
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(px - 4, py - 4, pw, ph);
  ctx.strokeStyle = C.med;
  ctx.strokeRect(px - 4, py - 4, pw, ph);

  ctx.font = '10px Courier New';
  ctx.fillStyle = C.accent;
  ctx.fillText('PACKET ACTIVITY', px, py + 8);
  ctx.strokeStyle = C.med;
  ctx.beginPath(); ctx.moveTo(px, py + 12); ctx.lineTo(px + 110, py + 12); ctx.stroke();

  if (packetLog.length === 0) {
    ctx.fillStyle = C.faint;
    ctx.fillText('Waiting for traffic...', px, py + 28);
  } else {
    for (let i = 0; i < Math.min(packetLog.length, 9); i++) {
      const log = packetLog[i];
      const y = py + 24 + i * 13;
      const ts = [log.time.getHours(), log.time.getMinutes(), log.time.getSeconds()]
        .map(v => String(v).padStart(2, '0')).join(':');

      // Fade older entries
      ctx.fillStyle = i === 0 ? C.glow : i < 3 ? C.dim : C.faint;
      const line = `${ts} ${log.from.substring(0,8).padEnd(9)}> ${log.to.substring(0,8)}`;
      ctx.fillText(line, px, y);
    }
  }

  // Blinking cursor
  if (Math.floor(frame / 15) % 2 === 0) {
    const cy = py + 24 + Math.min(packetLog.length, 9) * 13;
    if (cy < py + ph - 10) {
      ctx.fillStyle = C.bright;
      ctx.fillRect(px, cy - 2, 6, 10);
    }
  }
}

// ── Bottom-Right: ARP Table (real device data) ──
function drawPanelBottomRight() {
  const pw = 280, ph = 140;
  const px = W - pw - 10;
  const py = H - ph - 28;
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(px - 4, py - 4, pw, ph);
  ctx.strokeStyle = C.med;
  ctx.strokeRect(px - 4, py - 4, pw, ph);

  ctx.font = '10px Courier New';
  ctx.fillStyle = C.accent;
  ctx.fillText('ARP TABLE', px, py + 8);
  ctx.strokeStyle = C.med;
  ctx.beginPath(); ctx.moveTo(px, py + 12); ctx.lineTo(px + 80, py + 12); ctx.stroke();

  // Header
  ctx.fillStyle = C.dim;
  ctx.fillText('IP ADDRESS       MAC ADDRESS        HOST', px, py + 24);

  // Show real devices from live data, scroll through them
  const maxRows = 8;
  const scrollOffset = Math.floor(frame / 120) % Math.max(1, liveDevices.length);

  for (let i = 0; i < Math.min(maxRows, liveDevices.length); i++) {
    const idx = (scrollOffset + i) % liveDevices.length;
    const dev = liveDevices[idx];
    const y = py + 36 + i * 12;

    const ip = (dev.ip || '').padEnd(17);
    const mac = (dev.mac || 'UNKNOWN').substring(0, 17).padEnd(19);
    const name = (dev.hostname || '???').substring(0, 10);

    ctx.fillStyle = dev.is_self ? C.magenta : C.faint;
    ctx.fillText(`${ip}${mac}${name}`, px, y);
  }

  // Scroll indicator
  if (liveDevices.length > maxRows) {
    ctx.fillStyle = C.faint;
    ctx.textAlign = 'right';
    ctx.fillText(`${scrollOffset + 1}-${Math.min(scrollOffset + maxRows, liveDevices.length)}/${liveDevices.length}`, px + pw - 12, py + 8);
    ctx.textAlign = 'left';
  }
}

function updateNodes() {
  const margin = 80;
  for (const n of nodes) {
    if (n.type === 'router') continue; // Router stays centered
    n.x += n.vx;
    n.y += n.vy;
    n.vx += (Math.random() - 0.5) * 0.015;
    n.vy += (Math.random() - 0.5) * 0.015;
    n.vx *= 0.99;
    n.vy *= 0.99;
    if (n.x < margin) { n.x = margin; n.vx = Math.abs(n.vx); }
    if (n.x > W - margin) { n.x = W - margin; n.vx = -Math.abs(n.vx); }
    if (n.y < margin) { n.y = margin; n.vy = Math.abs(n.vy); }
    if (n.y > H - margin) { n.y = H - margin; n.vy = -Math.abs(n.vy); }
  }
}

function render() {
  // Fetch network data periodically
  const now = Date.now();
  if (now - lastFetch > FETCH_INTERVAL) {
    fetchNetwork();
    lastFetch = now;
  }

  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  drawGrid();

  if (nodes.length === 0) {
    // Waiting for data
    ctx.font = '16px Courier New';
    ctx.fillStyle = C.accent;
    ctx.textAlign = 'center';
    ctx.fillText('SCANNING NETWORK...', W / 2, H / 2);
    ctx.fillStyle = C.dim;
    ctx.font = '11px Courier New';
    ctx.fillText('Waiting for ARP discovery', W / 2, H / 2 + 25);
    ctx.textAlign = 'left';
  } else {
    drawConnections();
    drawNodes();
    drawPackets();
    drawPanelTopLeft();
    drawPanelTopRight();
    drawPanelBottomLeft();
    drawPanelBottomRight();
    updateNodes();
    if (Math.random() < 0.06) spawnPacket();
  }

  drawChrome();

  frame++;
  requestAnimationFrame(render);
}

window.addEventListener('resize', resize);
resize();
fetchNetwork();
lastFetch = Date.now();
render();
</script>
</body>
</html>
