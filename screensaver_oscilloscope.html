<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CYBER-CORE // SIGNAL ANALYSIS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; cursor: none; font-family: 'Courier New', monospace; }
canvas { display: block; }
/* CRT scanlines */
body::after {
  content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
  pointer-events: none; z-index: 99;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, frame = 0;

// Theme colors
const C = {
  bg: '#000000',
  grid: 'rgba(0, 80, 30, 0.15)',
  gridMajor: 'rgba(0, 80, 30, 0.25)',
  faint: '#014020',
  dim: '#02A060',
  med: '#056930',
  bright: '#00FF80',
  glow: '#00FFB4',
  accent: '#04FF9A',
  amber: '#FFA820',
};

const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const DAYS = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];

// Waveform state
const waves = [];
const NUM_WAVES = 4;
const LABELS = ['ALPHA // CPU CORE', 'BETA // GPU STREAM', 'GAMMA // MEMORY BUS', 'DELTA // NETWORK I/O'];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  waves.length = 0;
  const waveH = Math.floor((H - 160) / NUM_WAVES);
  for (let i = 0; i < NUM_WAVES; i++) {
    waves.push({
      y: 80 + i * waveH,
      h: waveH,
      mid: 80 + i * waveH + waveH / 2,
      freq: 0.02 + Math.random() * 0.03,
      amp: waveH * 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: 0.03 + Math.random() * 0.02,
      noise: 0.3 + Math.random() * 0.4,
      history: new Float32Array(Math.ceil(W)),
      histIdx: 0,
      color: i === 0 ? C.glow : i === 1 ? C.accent : i === 2 ? C.bright : C.amber,
      colorDim: i === 0 ? 'rgba(0,255,180,0.15)' : i === 1 ? 'rgba(4,255,154,0.15)' : i === 2 ? 'rgba(0,255,128,0.15)' : 'rgba(255,168,32,0.15)',
      label: LABELS[i],
    });
  }
}

function drawGrid() {
  // Minor grid
  ctx.strokeStyle = C.grid;
  ctx.lineWidth = 0.5;
  for (let x = 0; x < W; x += 20) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 20) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  // Major grid
  ctx.strokeStyle = C.gridMajor;
  for (let x = 0; x < W; x += 100) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 100) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function drawHeader() {
  // Top bar
  ctx.fillStyle = C.accent;
  ctx.fillRect(0, 0, W, 3);
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 3, W, 28);
  ctx.strokeStyle = C.med;
  ctx.beginPath(); ctx.moveTo(0, 31); ctx.lineTo(W, 31); ctx.stroke();

  ctx.font = '11px Courier New';
  ctx.fillStyle = C.dim;
  ctx.fillText('CLASSIFICATION:', 12, 14);
  ctx.fillStyle = C.bright;
  ctx.fillText('MONITORING', 120, 14);
  ctx.fillStyle = C.faint;
  ctx.fillText('TERMINAL 7 // CYBER-CORE v2.0', 12, 26);

  ctx.fillStyle = C.accent;
  ctx.textAlign = 'right';
  ctx.fillText('SYS://SIGNAL_ANALYSIS', W - 12, 14);
  ctx.fillStyle = C.faint;
  ctx.fillText('MULTI-CHANNEL OSCILLOSCOPE', W - 12, 26);
  ctx.textAlign = 'left';
}

function drawFooter() {
  const y = H - 20;
  ctx.strokeStyle = C.med;
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, y + 1, W, 19);

  ctx.font = '11px Courier New';
  ctx.fillStyle = C.dim;
  ctx.fillText('SIGNAL ACQUISITION ACTIVE // ALL CHANNELS NOMINAL', 12, y + 14);
  ctx.fillStyle = C.faint;
  ctx.textAlign = 'right';
  ctx.fillText('CYBER-CORE // SCREENSAVER MODE', W - 12, y + 14);
  ctx.textAlign = 'left';
}

function drawClock() {
  const now = new Date();
  const timeStr = [now.getHours(), now.getMinutes(), now.getSeconds()]
    .map(v => String(v).padStart(2, '0')).join(':');
  const dateStr = `${String(now.getDate()).padStart(2,'0')} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;

  // Clock in top-center
  ctx.font = '11px Courier New';
  ctx.textAlign = 'center';
  ctx.fillStyle = C.glow;
  ctx.fillText(timeStr, W / 2, 14);
  ctx.fillStyle = C.dim;
  ctx.fillText(dateStr + ' // ' + DAYS[now.getDay()], W / 2, 26);
  ctx.textAlign = 'left';
}

function drawWaves() {
  for (let w = 0; w < waves.length; w++) {
    const wv = waves[w];

    // Separator line
    ctx.strokeStyle = C.med;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, wv.y); ctx.lineTo(W, wv.y); ctx.stroke();

    // Centerline
    ctx.strokeStyle = C.faint;
    ctx.setLineDash([4, 8]);
    ctx.beginPath(); ctx.moveTo(0, wv.mid); ctx.lineTo(W, wv.mid); ctx.stroke();
    ctx.setLineDash([]);

    // Label
    ctx.font = '11px Courier New';
    ctx.fillStyle = wv.color;
    ctx.fillText(wv.label, 14, wv.y + 16);

    // Amplitude readout
    const peakVal = (Math.sin(frame * wv.speed * 0.7) * 50 + 50).toFixed(1);
    const freqVal = (wv.freq * 1000).toFixed(1);
    ctx.fillStyle = C.dim;
    ctx.fillText(`FREQ: ${freqVal}Hz  AMP: ${peakVal}%  STATUS: NOMINAL`, 14, wv.y + 28);

    // Corner brackets
    ctx.strokeStyle = C.accent;
    ctx.lineWidth = 1.5;
    const bx = 8, by = wv.y + 4, bw = W - 16, bh = wv.h - 8;
    // TL
    ctx.beginPath(); ctx.moveTo(bx, by + 14); ctx.lineTo(bx, by); ctx.lineTo(bx + 14, by); ctx.stroke();
    // TR
    ctx.beginPath(); ctx.moveTo(bx + bw - 14, by); ctx.lineTo(bx + bw, by); ctx.lineTo(bx + bw, by + 14); ctx.stroke();
    // BL
    ctx.beginPath(); ctx.moveTo(bx, by + bh - 14); ctx.lineTo(bx, by + bh); ctx.lineTo(bx + 14, by + bh); ctx.stroke();
    // BR
    ctx.beginPath(); ctx.moveTo(bx + bw - 14, by + bh); ctx.lineTo(bx + bw, by + bh); ctx.lineTo(bx + bw, by + bh - 14); ctx.stroke();

    // Generate waveform sample
    const t = frame * wv.speed;
    let sample = Math.sin(t + wv.phase) * wv.amp;
    sample += Math.sin(t * 2.3 + wv.phase * 0.7) * wv.amp * 0.3;
    sample += Math.sin(t * 5.1) * wv.amp * 0.1;
    sample += (Math.random() - 0.5) * wv.amp * wv.noise;
    // Occasional spike
    if (Math.random() < 0.005) sample += (Math.random() - 0.5) * wv.amp * 2;

    wv.history[wv.histIdx % W] = sample;
    wv.histIdx++;

    // Draw filled waveform
    ctx.beginPath();
    ctx.moveTo(0, wv.mid);
    for (let x = 0; x < W; x++) {
      const idx = (wv.histIdx - W + x + W * 2) % W;
      const val = wv.history[idx] || 0;
      ctx.lineTo(x, wv.mid - val);
    }
    ctx.lineTo(W, wv.mid);
    ctx.closePath();
    ctx.fillStyle = wv.colorDim;
    ctx.fill();

    // Draw waveform line
    ctx.beginPath();
    for (let x = 0; x < W; x++) {
      const idx = (wv.histIdx - W + x + W * 2) % W;
      const val = wv.history[idx] || 0;
      if (x === 0) ctx.moveTo(x, wv.mid - val);
      else ctx.lineTo(x, wv.mid - val);
    }
    ctx.strokeStyle = wv.color;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Bright head dot
    const headVal = wv.history[(wv.histIdx - 1 + W * 2) % W] || 0;
    ctx.beginPath();
    ctx.arc(W - 1, wv.mid - headVal, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(W - 1, wv.mid - headVal, 6, 0, Math.PI * 2);
    ctx.fillStyle = wv.colorDim;
    ctx.fill();
  }
}

function render() {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  drawGrid();
  drawHeader();
  drawClock();
  drawWaves();
  drawFooter();

  frame++;
  requestAnimationFrame(render);
}

window.addEventListener('resize', resize);
resize();
render();
</script>
</body>
</html>
